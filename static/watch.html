<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenShare — Watching &amp; controlling</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
  #wrap { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
  video { width: 100%; background: #000; border-radius: 12px; }
  .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-top: 16px; }
  #state { color: #94a3b8; }
  #controlState { font-weight: bold; }
  .on { color: #4ade80; }
  .off { color: #f87171; }
  footer { margin-top: 32px; padding: 16px 0; border-top: 1px solid #334155; color: #94a3b8; font-size: 14px; }
  footer nav { display: flex; flex-wrap: wrap; gap: 16px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>👀 Watching</h1>
  <div class="card">
    <p id="state">Waiting for the other person to start sharing…</p>
    <p id="controlState" class="off">● Control: awaiting their consent</p>
    <p class="off" id="controlHint" style="color:#94a3b8;font-size:14px">
      Once they tick the consent box and run the agent, your mouse / keyboard / scroll here will
      control their computer. Keep this page focused while you type.
    </p>
  </div>
  <video id="remote" autoplay playsinline></video>
  <footer>
    <nav aria-label="Contact and profiles">
      <a href="https://github.com/Ultra-0x" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="mailto:Odunukanabayomi1111@gmail.com">Email</a>
      <a href="https://linkedin.com/in/odunukan-abayomi" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </nav>
  </footer>
</div>

<script>
const room = location.pathname.split("/").filter(Boolean)[1];
const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
const stateEl = document.getElementById("state");
const controlStateEl = document.getElementById("controlState");
const videoEl = document.getElementById("remote");

let consented = false;
let lastMove = 0;

function setControl(on) {
  consented = on;
  controlStateEl.textContent = on
    ? "● Control: ACTIVE — you are controlling their computer"
    : "● Control: awaiting their consent";
  controlStateEl.className = on ? "on" : "off";
}

function normCoords(e) {
  const r = videoEl.getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  return { x: x, y: y };
}

function sendControl(obj) {
  if (!consented) return;
  if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "control", ...obj }));
}

// --- Mouse control over the video ---
videoEl.addEventListener("mousemove", (e) => {
  const now = Date.now();
  if (now - lastMove < 33) return;      // throttle to ~30/s
  lastMove = now;
  const { x, y } = normCoords(e);
  sendControl({ action: "mousemove", x: x, y: y });
});
videoEl.addEventListener("mousedown", (e) => {
  e.preventDefault();
  const { x, y } = normCoords(e);
  sendControl({ action: "mousedown", x: x, y: y, button: e.button === 2 ? "right" : "left" });
});
videoEl.addEventListener("mouseup", (e) => {
  e.preventDefault();
  const { x, y } = normCoords(e);
  sendControl({ action: "mouseup", x: x, y: y, button: e.button === 2 ? "right" : "left" });
});
videoEl.addEventListener("click", (e) => {
  e.preventDefault();
  const { x, y } = normCoords(e);
  sendControl({ action: "click", x: x, y: y, button: e.button === 2 ? "right" : "left" });
});
videoEl.addEventListener("wheel", (e) => {
  e.preventDefault();
  sendControl({ action: "scroll", dy: e.deltaY > 0 ? 1 : -1 });
});

// --- Keyboard control (page must stay focused) ---
window.addEventListener("keydown", (e) => {
  if (e.key === "F12" || e.key.startsWith("F")) return;
  e.preventDefault();
  if (!e.repeat) sendControl({ action: "keydown", key: e.key });
});
window.addEventListener("keyup", (e) => {
  if (e.key === "F12" || e.key.startsWith("F")) return;
  sendControl({ action: "keyup", key: e.key });
});

// --- WebRTC ---
const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
pc.ontrack = (e) => {
  videoEl.srcObject = e.streams[0];
  stateEl.textContent = "● Connected — seeing their screen live.";
};

// --- Signalling ---
const ws = new WebSocket(`${wsProto}//${location.host}/ws/${room}?role=viewer`);
ws.onmessage = async (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.type === "state") {
    setControl(!!msg.consented);
  } else if (msg.type === "agent") {
    if (msg.status === "controlling") setControl(true);
  } else if (msg.type === "offer") {
    await pc.setRemoteDescription(msg.sdp);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    ws.send(JSON.stringify({ type: "answer", sdp: pc.localDescription }));
  } else if (msg.type === "candidate" && msg.candidate) {
    await pc.addIceCandidate(msg.candidate);
  }
};
ws.onclose = () => { stateEl.textContent = "Disconnected."; };
</script>
</body>
</html>
